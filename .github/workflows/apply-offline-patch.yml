name: Apply offline Bible patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-offline-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('width=device-width,initial-scale=1,viewport-fit=cover','width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover')
          s=s.replace('<main><p class="status" id="status">Berean Standard Bible · Continuous reading mode</p>','<main><p class="status" id="status" hidden></p>')
          s=s.replace('<div class="footer-note">Berean Standard Bible (BSB). Public domain / CC0 source text. Chapter and verse references are retained as metadata but hidden during normal reading.</div>','<div class="footer-note">Chapter and verse references are retained as metadata but hidden during normal reading.</div>')
          s=s.replace('status.textContent=`Berean Standard Bible · Loading ${b.chapters} chapters…`;','status.hidden=true;')
          s=s.replace("status.textContent=Object.keys(customEdits).length?'Berean Standard Bible · Custom edits enabled':'Berean Standard Bible · Continuous reading mode';",'status.hidden=true;')
          if '<script src="offline.js"></script>' not in s:
              s=s.replace('</body></html>','<script src="offline.js"></script>\n</body></html>')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable offline Bible reading and remove BSB labels"
          git push
